syntax = "proto3";

package bridge.v1;

option java_package = "dev.bridge.protocol.v1";
option java_multiple_files = true;
option swift_prefix = "Bridge_";

message NotificationActionDescriptor {
  string action_id = 1;
  string label = 2;
  bool requires_text_input = 3;
}

message NotificationEvent {
  string event_id = 1;
  string origin_device_id = 2;
  string source_package_or_bundle_id = 3;
  string title = 4;
  string body = 5;
  string category = 6;
  int64 posted_at_unix_ms = 7;
  bool is_sensitive = 8;
  repeated NotificationActionDescriptor actions = 9;
}

message NotificationAction {
  string event_id = 1;
  string action_id = 2;
  string text_input = 3;
}
