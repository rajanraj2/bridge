name: Automated Release by Label

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

jobs:
  check-and-bump:
    name: Evaluate Release Label & Tag Release
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request.merged == true)

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump level from PR labels or dispatch
        id: determine_bump
        run: |
          BUMP=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump_type }}"
          else
            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            echo "PR labels: ${LABELS}"
            if echo "${LABELS}" | grep -qiE "release:major|major"; then
              BUMP="major"
            elif echo "${LABELS}" | grep -qiE "release:minor|minor"; then
              BUMP="minor"
            elif echo "${LABELS}" | grep -qiE "release:patch|patch|release"; then
              BUMP="patch"
            fi
          fi

          if [ -z "${BUMP}" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No release label detected on merged PR. Skipping automated release."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "bump_type=${BUMP}" >> $GITHUB_OUTPUT
            echo "Detected release label! Will execute '${BUMP}' version bump."
          fi

      - name: Execute Version Bump & Tag
        if: steps.determine_bump.outputs.should_release == 'true'
        run: |
          BUMP_TYPE="${{ steps.determine_bump.outputs.bump_type }}"
          chmod +x scripts/bump_version.sh
          ./scripts/bump_version.sh "${BUMP_TYPE}"

          NEW_VERSION="$(cat VERSION | tr -d '[:space:]')"
          TAG="v${NEW_VERSION}"
          echo "New release tag: ${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION android/app/build.gradle.kts scripts/package_macos.sh scripts/package_android.sh CHANGELOG.md
          git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]" || true
          git tag -a "${TAG}" -m "Bridge ${TAG} - Automated Release"

          git push origin main
          git push origin "${TAG}"
