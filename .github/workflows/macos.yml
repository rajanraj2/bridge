name: macOS CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test macOS App
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift Package Tests
        run: |
          cd macos
          swift test

      - name: Build macOS Executable (Release)
        run: |
          cd macos
          swift build -c release
