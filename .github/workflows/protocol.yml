name: Protocol CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    name: Validate Protobuf Schemas & Fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Validate Protobuf Syntax
        run: |
          protoc --proto_path=protocol/proto --descriptor_set_out=/dev/null protocol/proto/bridge/v1/*.proto

      - name: Validate JSON Fixture Formats
        run: |
          python3 -c "
          import json, glob, sys
          fixtures = glob.glob('protocol/fixtures/*.json')
          assert len(fixtures) > 0, 'No fixtures found'
          for f in fixtures:
              with open(f, 'r') as fp:
                  data = json.load(fp)
                  assert 'messageId' in data, f'Missing messageId in {f}'
                  assert 'sessionId' in data, f'Missing sessionId in {f}'
                  assert 'senderDeviceId' in data, f'Missing senderDeviceId in {f}'
          print(f'Successfully validated {len(fixtures)} fixtures.')
          "
